# Glass Atrium CI — clean-runner install + test proof.
#
# Honest-skip contract (what CANNOT run on a hosted runner, and why):
#   * macOS launchd bootstrap (launchctl bootout/bootstrap/kickstart) is a
#     manual user step by design — the E2E (test/oss-e2e-bootstrap.sh) already
#     STATIC-verifies rendered plists only and never invokes launchctl, so CI
#     inherits that contract. No launchctl call appears anywhere below.
#   * The live `claude` CLI is optional (README Prerequisites) and metered;
#     autoagents-eval.sh / claude-driven daemon cycles are NOT exercised in CI.
#     glass-atrium's post-install `claude --doctor` is advisory and is reached
#     ONLY via `install`, never via the read-only `doctor` subcommand run here.
#   * The full sandboxed E2E (oss-e2e-bootstrap.sh) needs Unix-socket PEER-auth
#     Postgres on /tmp. Hosted runners give that ONLY via a natively-installed
#     cluster reconfigured to listen on /tmp (the `services:` Docker Postgres is
#     TCP/password auth — incompatible with the host=/tmp peer-auth contract).
#     The test-monitor + test-e2e jobs install Postgres natively for exactly this.
#
# What DOES run: monitor typecheck + node:test (live DB + real chromium),
# autoagent unittest suites, the bats hook/script/installer suites, the
# read-only glass-atrium doctor preflight, and the sandboxed E2E bootstrap.
#
# Job naming (consistent STAGE-PREFIX scheme): fast-gate jobs carry a `gate-`
# prefix, language + E2E jobs a `test-` prefix, change detection is `detect-`,
# and the single required aggregate keeps its historical `ci-pass` key.
#
# Job graph (4-stage gated DAG, not a flat parallel fan-out):
#   Stage 1  fast-gate (no services): gate-lint · gate-typecheck · gate-doctor
#   Stage 2  language jobs (gated on fast-gate + per-stack `detect-changes` filter):
#            test-bash · test-python · test-python-pytest · test-monitor (the
#            sole Postgres+chromium job)
#            + test-install-macos — the ONLY macos-latest job. Gated on the
#            fast-gate ALONE (no `detect-changes` filter, no `if:`), so it runs
#            on every PR; see its own comment for why.
#   Stage 3  test-e2e (advisory / PR-optional, continue-on-error)
#   Stage 4  ci-pass — the SINGLE required status check; aggregates the gate.

name: ci

# Quoted to avoid the YAML 1.1 bareword `on` → boolean coercion (GitHub's
# parser is fine either way; quoting keeps third-party YAML linters honest).
#
# SECURITY (audited-safe by design): this uses `pull_request`, NOT
# `pull_request_target`. `pull_request` runs the workflow in the FORK's context
# with a READ-ONLY GITHUB_TOKEN and NO access to repo secrets — so a malicious
# PR from a fork cannot exfiltrate secrets or gain write scope even while
# executing untrusted PR code. `pull_request_target` (which runs in the BASE
# repo context with a writable token + secret access against unreviewed fork
# code) is the classic privilege-escalation footgun and is deliberately NOT
# used. Combined with the deny-all `permissions: {}` default below, the CI
# attack surface for fork PRs is minimal.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Deny-all at the workflow level (least privilege): NO job here writes with the
# GITHUB_TOKEN — the language/gate jobs only READ the tree, and upload-artifact
# uses the runtime artifact token (NOT a `permissions` scope). Each job re-grants
# exactly `contents: read` at the job level. This deny-all is scoped to ci.yml
# ONLY — release.yml keeps its own `contents: write` (gh release create needs it).
#
# SECURITY (audited-safe): no OIDC (`id-token: write`) block is needed. OIDC
# only earns its keep when a job must mint a short-lived cloud credential
# (AWS/GCP/Azure federation) — CI here never talks to an external cloud. Every
# authenticated call uses the ambient, keyless `github.token`/GITHUB_TOKEN,
# which requires no OIDC exchange, so omitting `id-token` is correct (adding it
# would only widen the token surface for zero benefit). `harden-runner` runs in
# `egress-policy: audit` on the heavy jobs precisely to confirm this — a first
# real run's egress baseline should show no external-cloud auth traffic.
permissions: {}

jobs:
  # ===========================================================================
  # STAGE 1 — fast-gate: cheap, service-free checks that fail early. Nothing
  # here needs Postgres or chromium; all three run in parallel with no `needs`.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Lint the workflow files themselves (rhysd/actionlint). Catches expression
  # typos, invalid `needs`, shellcheck issues in run: blocks — before any of the
  # heavier jobs spend runner minutes.
  # ---------------------------------------------------------------------------
  gate-lint:
    name: "gate: lint workflows (actionlint)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  # ---------------------------------------------------------------------------
  # Monitor typecheck WITHOUT a live database. `tsc --noEmit` needs the
  # generated Prisma client (git-ignored at monitor/src/generated/prisma, so
  # ABSENT on a fresh checkout) — but `prisma generate` does NOT need a live DB
  # (it never connects). It DOES need config load to succeed, and Prisma 7's
  # config `env()` helper resolves EAGERLY at config-load time: it fails the
  # load if ANY referenced env var is unresolvable, whether or not a connecting
  # command runs. prisma.config.ts references BOTH env("DATABASE_URL") and
  # env("SHADOW_DATABASE_URL") (datasource + shadowDatabaseUrl), so BOTH must be
  # present as harmless dummies — generate never dereferences the values.
  # This keeps the fast-gate service-free. Sequence is load-bearing:
  #   npm ci  →  npx prisma generate  →  npm run typecheck
  # npm ci first so the prisma CLI + generated-client deps exist; generate lands
  # the client at src/generated/prisma; then tsc consumes it.
  # ---------------------------------------------------------------------------
  gate-typecheck:
    name: "gate: monitor typecheck (no DB)"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node toolchain (monitor/.nvmrc) + npm cache + Playwright browser cache.
      - name: Set up monitor Node
        uses: ./.github/actions/setup-monitor-node

      # npm ci first: without it the prisma CLI and generated-client deps are
      # absent, so the next `prisma generate` would fail.
      - name: Install monitor deps
        working-directory: monitor
        run: npm ci

      # Generate the Prisma client offline. Both dummies exist ONLY so config
      # load succeeds — Prisma 7's config env() resolves eagerly, so an absent
      # DATABASE_URL or SHADOW_DATABASE_URL fails the load before generate runs.
      # Neither value is ever dereferenced, since no connecting command runs.
      - name: Generate Prisma client (no DB)
        working-directory: monitor
        env:
          DATABASE_URL: postgresql://dummy@localhost/dummy?host=/tmp
          SHADOW_DATABASE_URL: postgresql://dummy@localhost/dummy_shadow?host=/tmp
        run: npx prisma generate

      - name: Typecheck
        working-directory: monitor
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # Installer read-only preflight. `glass-atrium doctor` is mutation-free: it
  # checks GA root, a writable throwaway target home (GA_TARGET_HOME), same
  # device, manifest integrity, and hook bindings (binding gaps WARN, never
  # FAIL on a fresh tree). It NEVER writes settings.json and never reaches the
  # advisory `claude --doctor` post-check (that path is `install`-only).
  # jq is required — doctor's manifest-integrity check shells out to jq.
  # ---------------------------------------------------------------------------
  gate-doctor:
    name: "gate: glass-atrium doctor preflight"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run doctor against a throwaway target home
        run: |
          GA_TARGET_HOME="$(mktemp -d)" ./glass-atrium doctor

  # ===========================================================================
  # STAGE 2 — language jobs. Gated on the fast-gate passing AND on a per-stack
  # `detect-changes` path filter so an unrelated diff skips the irrelevant
  # stacks. A skipped job counts as OK at ci-pass (see stage 4).
  # ONE deliberate exception: test-install-macos (end of this stage) carries no
  # path filter and runs on every PR — its rationale is stated at the job.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Per-stack change detection (dorny/paths-filter). Each output is consumed by
  # the matching language job's `if:`. IMPORTANT push-event safety: on a first
  # push / force-push / brand-new branch the before-SHA can be all-zeros, which
  # would make the filter skip EVERY language job while ci-pass (always()) still
  # turns green with zero real testing. The fail-safe is the action's own
  # missing-base behavior: when paths-filter cannot diff a base it reports every
  # filter as changed, so every stack runs. There is deliberately no
  # `predicate-quantifier:` key — `every` ANDs a filter's patterns together,
  # which would make these positive-only lists never match (a real false-green).
  # ---------------------------------------------------------------------------
  detect-changes:
    name: detect changed stacks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [gate-lint, gate-typecheck, gate-doctor]
    outputs:
      bash: ${{ steps.filter.outputs.bash }}
      python: ${{ steps.filter.outputs.python }}
      monitor: ${{ steps.filter.outputs.monitor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          # No `base:`/`ref:` override → on a pull_request the action diffs the
          # PR base; on a push it diffs against the before-SHA. When that base
          # is unresolvable (all-zeros before-SHA on a new-branch/force push),
          # the action reports every filter as changed — which is exactly the
          # fail-safe we want (run everything rather than false-green).
          filters: |
            bash:
              - 'hooks/**'
              - 'scripts/**'
              - 'test/**'
              - 'autoagent/test/**'
              - '**/*.sh'
              - '**/*.bats'
              - 'rules/**'
              - 'agents/**'
              - 'scoped/**'
              - 'skills/**'
              - '**/*.md'
            python:
              - 'autoagent/**'
              - '**/*.py'
            monitor:
              - 'monitor/**'
              - '**/*.ts'
              - 'package.json'
              - 'package-lock.json'

  # ---------------------------------------------------------------------------
  # Bats suites for hooks, operational scripts, the installer, AND the autoagent
  # git-txn / daemon-apply suites — split across a matrix into 6 legs so each runs
  # on its OWN runner concurrently. test/ (the largest root, and the home of the
  # two heaviest files doctor-auth-report-scan-sigpipe +
  # deps-preflight-noninteractive) is sharded 3-way by a deterministic round-robin
  # over its sorted *.bats, so its wall-clock drops to ~1/3; hooks/test,
  # scripts/test and autoagent/test each run as a single leg. Per-root suite counts
  # are deliberately NOT quoted here — they move with every suite added, so a
  # hand-copied census re-drifts on the next edit; read them from a
  # `find <root> -name '*.bats'` run instead. The shards + single legs cover every
  # suite under those four roots in aggregate, which is the invariant that matters. A
  # matrix job is a SINGLE node in the `needs` graph, so ci-pass observing
  # `test-bash` already aggregates every leg (any one leg's failure reddens the
  # whole test-bash node). No suite REQUIRES a Postgres service, launchd or the
  # claude CLI: most are hermetic (mktemp sandboxes + PATH-prepended stub
  # binaries for psql/createdb/launchctl/tmux/claude), and the six DB-dualwrite
  # suites under hooks/test (agent-tracker, cost-tracker-dualwrite,
  # ephemeral-pg-locale, pre-compact-db-source, track-outcome-dedup-collision,
  # track-outcome-qa-score-persist) instead spin their OWN ephemeral cluster into
  # BATS_FILE_TMPDIR via initdb/pg_ctl. Those six therefore REDUCE coverage —
  # they do not fail — when initdb/pg_ctl/createdb/psql/python3 are absent from
  # the runner: setup_file sets an EPH_SKIP marker that each test's setup()
  # turns into a per-test `skip`. That reduction is not silent; it lands in the
  # junit `skipped=` count the summarize step prints, so the claim "green with N
  # visible skips" is verifiable from the step summary rather than asserted here.
  # None of the suites load bats-support/bats-assert helper libraries, so a plain
  # bats-core install suffices (no BATS_LIB_PATH).
  # ---------------------------------------------------------------------------
  test-bash:
    name: "test: bats (${{ matrix.name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # mikepenz/action-junit-report posts inline PR annotations via a check-run
      # → it needs `checks: write` on top of the deny-all baseline. This is the
      # ONE scope the reporter adds; nothing else in this job writes a token.
      checks: write
    needs: [gate-lint, gate-typecheck, gate-doctor, detect-changes]
    if: needs.detect-changes.outputs.bash == 'true'
    strategy:
      # fail-fast:false so a red leg does NOT cancel the others — each leg
      # reports independently and ci-pass still observes the aggregate result.
      fail-fast: false
      matrix:
        # test/ carries the two heaviest files and blows the per-leg timeout as a
        # single root, so it is sharded 3-way (round-robin over its sorted *.bats,
        # partitioned in the run step). The other three roots stay single legs —
        # `shard:0`/`shards:0` selects the unsharded --recursive branch. 6 legs.
        include:
          - name: "test (shard 1/3)"
            root: test
            shard: 1
            shards: 3
          - name: "test (shard 2/3)"
            root: test
            shard: 2
            shards: 3
          - name: "test (shard 3/3)"
            root: test
            shard: 3
            shards: 3
          - name: hooks/test
            root: hooks/test
            shard: 0
            shards: 0
          - name: scripts/test
            root: scripts/test
            shard: 0
            shards: 0
          - name: autoagent/test
            root: autoagent/test
            shard: 0
            shards: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0

      # `bats --jobs` shells out to GNU parallel; without it bats silently degrades
      # to serial. Install it explicitly so the parallel invocation below is honored.
      - name: Install GNU parallel (bats --jobs dependency)
        run: sudo apt-get update && sudo apt-get install -y parallel

      # Blocking absorption audit of the SCOPE_FILES-listed unattended-execution
      # scope (the array in scripts/audit-absorption.sh is its single source of
      # truth — read the list, never a count quoted in prose; doc-739
      # promotion). Pinned to ONE leg via the matrix-root condition so
      # it runs once on the shared checkout; ci-pass already observes test-bash
      # as a single node, so a non-zero auditor exit reddens the gate with no
      # extra `needs` wiring.
      #
      # ORDERING IS LOAD-BEARING: a step-level `if:` defaults to `success()`, so
      # an auditor placed AFTER the bats step would be skipped exactly when the
      # leg is already red — a blocking gate that stops gating on failure. It
      # runs BEFORE the bats step instead.
      #
      # DISCLOSURE (residual, stated rather than overstated): the job carries
      # `if: needs.detect-changes.outputs.bash == 'true'`, so a PR touching no
      # shell/bats file skips this leg and the auditor with it. No non-shell
      # change can introduce a scope absorption site, but the gate is
      # change-conditional — not unconditional.
      - name: Audit silent-fail absorption annotations (blocking)
        if: matrix.root == 'scripts/test'
        run: bash scripts/audit-absorption.sh

      # DIAGNOSTIC (per-file timeout + filename tag): each *.bats file runs as
      # its OWN GNU parallel job instead of a single `bats --jobs` call. Why:
      # `bats --jobs` buffers a file's TAP and flushes only on file COMPLETION,
      # so a file that HANGS never flushes — the CI log never names it, it just
      # burns the 15-min leg timeout in silence. `parallel --timeout 240` kills
      # any single file exceeding 240s (no legit file runs >~60s; the hang is
      # ~900s) and prints a warning naming the killed command (which carries the
      # file path), while `--tagstring '{}'` prefixes every output line with the
      # file path — so the offender is unmistakable either way.
      #
      # junit output goes to a PER-FILE report directory. bats always names the
      # report `report.xml` and only `--output <dir>` varies, so collision-freedom
      # has to come from the DIRECTORY, not the filename. The directory is keyed
      # on `{.}` — the input path minus its extension — NOT on `{/.}` (basename
      # minus extension): test/ nests a comment-audit/ subdir, so a basename key
      # maps test/x.bats and test/comment-audit/x.bats onto ONE dir where the
      # second report silently clobbers the first. Path keys are unique by
      # construction, which is what makes the aggregate count trustworthy.
      # `--output` requires the dir to already exist (bats errors "not writeable"
      # otherwise), hence the inline `mkdir -p` per job. `--report-formatter` is
      # deliberately NOT `--formatter`: it adds the report file and leaves stdout
      # as TAP, so the per-file `--tagstring` hang diagnostic above survives
      # intact. The ci-pass gate still keys on parallel's exit code — NOT
      # swallowed (no `|| true`), so a failed or timed-out file reddens the leg.
      # A timed-out file writes no report, so a report count below the file count
      # is itself a signal that a file was killed.
      - name: Run bats suite (${{ matrix.name }})
        env:
          # env-indirection: bind each matrix value to a shell var and dereference
          # only "${ROOT}"/"${SHARD}"/"${SHARDS}" in the body (never interpolate
          # ${{ }} into the run: text) — the expression-injection-safe shape ci-pass uses.
          ROOT: ${{ matrix.root }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
          # Point every suite's mktemp -d sandbox (mktemp honors $TMPDIR) at the
          # runner's tmpfs so the I/O-bound installer fixtures — copy/symlink farms
          # + the doctor-auth 1500-file fixture — land in RAM. Linux-CI-only:
          # /dev/shm always exists on ubuntu-latest; no test file or macOS path changes.
          TMPDIR: /dev/shm
        run: |
          mkdir -p reports/bats
          # One GNU parallel job per *.bats file (fed NUL-delimited so any odd
          # path survives). parallel owns the file-level concurrency: --jobs
          # $(nproc) bounds it to the runner core count; --timeout 240 kills a
          # single file running >240s (the diagnostic: name the hanging file);
          # --tagstring '{}' tags every output line with the file path. Each
          # `bats {}` runs exactly ONE file with no --jobs, so bats stays serial
          # WITHIN the file by DEFAULT (setup_file-once + ordered side effects
          # preserved) — a within/across-file --no-parallelize flag is both
          # redundant here AND rejected by bats (it requires --jobs>=2). parallel's
          # non-zero exit (a failed OR timed-out file) rides the pipe out —
          # pipefail is on via the GitHub default shell — to fail the leg, so the
          # ci-pass gate sees the real code.
          run_bats() {
            parallel -0 --timeout 240 --jobs "$(nproc)" --tagstring '{}' \
              'mkdir -p reports/bats/{.} && bats --report-formatter junit --output reports/bats/{.} {}'
          }
          if [[ "${SHARDS}" -gt 0 ]]; then
            # Sharded root: deterministic round-robin partition of this root's *.bats
            # across SHARDS legs. `sort` gives a stable index; `find` covers nested
            # dirs (test/comment-audit) AND auto-includes any newly-added file, so no
            # hardcoded glob can silently drift out of coverage. Portable while-read
            # (no bash-4 mapfile) keeps the partition Bash-3.2-safe.
            targets=()
            i=0
            while IFS= read -r f; do
              if [[ $((i % SHARDS + 1)) -eq "${SHARD}" ]]; then
                targets+=("${f}")
              fi
              i=$((i + 1))
            done < <(find "${ROOT}" -name '*.bats' | sort)
            # Loud-fail: an empty shard means SHARDS exceeds the file count (a
            # misconfigured matrix), not a benign no-op — surface it explicitly.
            if [[ "${#targets[@]}" -eq 0 ]]; then
              echo "FATAL: shard ${SHARD}/${SHARDS} of ${ROOT} matched 0 *.bats files" >&2
              exit 1
            fi
            printf '%s\0' "${targets[@]}" | run_bats
          else
            # Unsharded root: every *.bats under the tree, one parallel job each.
            find "${ROOT}" -name '*.bats' -print0 | sort -z | run_bats
          fi

      # Inline PR annotations from the junit report. Separate step, if:always()
      # so annotations post even when bats failed — but this step does NOT
      # swallow the bats exit code (that already propagated from the step above),
      # and fail_on_failure stays false so the reporter never masks a green/red
      # verdict the ci-pass gate already derives from bats itself.
      - name: Annotate bats results (junit → inline PR)
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6.4.2
        with:
          # Glob, not a single path: one report.xml per test file, nested under a
          # path-keyed directory (see the run step). Depth varies with the root.
          report_paths: reports/bats/**/report.xml
          # Per-leg check_name → 6 distinct check runs (one per leg) instead of
          # legs colliding on a single "bats results" check.
          check_name: "bats results (${{ matrix.name }})"
          fail_on_failure: false
          require_tests: false

      # GITHUB_STEP_SUMMARY aggregate. Parses every per-file junit report.xml
      # (tests / failures / errors / skipped counts live on the <testsuite>
      # element) into a one-line pass/fail summary; the `files` column is the
      # number of reports found, i.e. the evidence that the suite actually ran.
      # Honest-skip visibility: this ALSO
      # surfaces IN-JOB skipped bats tests (junit `skipped=` count) as a visible
      # line — path-filter JOB skips are out of scope here (a skipped job runs
      # zero steps; those are surfaced by ci-pass's skip=OK semantics instead).
      - name: Summarize bats results
        if: always()
        env:
          LABEL: ${{ matrix.name }}
        run: |
          # One report.xml per test file (path-keyed dirs, see the run step), so
          # the counts are summed across every report the leg produced.
          reports_root="reports/bats"
          if [[ -d "${reports_root}" ]]; then
            report_files="$(find "${reports_root}" -name report.xml | wc -l | tr -d ' ')"
          else
            report_files=0
          fi
          # Kept deliberately: with per-file reports wired, a zero count is now a
          # TRUE statement that the suite produced nothing, not an artifact of
          # never having asked bats for a report.
          if [[ "${report_files}" -eq 0 ]]; then
            echo "## bats (${LABEL}) — no junit report produced (suite did not run)" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          # Sum the attributes across every <testsuite> element in every report.
          # grep -o keeps this dependency-free (no xmllint); awk sums the
          # extracted integers. The <testsuites> wrapper carries only `time` (see
          # bats-format-junit), so whole-file matching cannot double-count.
          extract_sum() {
            find "${reports_root}" -name report.xml -exec grep -ohE "$1=\"[0-9]+\"" {} + \
              | grep -oE '[0-9]+' | awk '{ s += $1 } END { print s + 0 }'
          }
          # No `|| true` on the sums: every <testsuite> line carries all four
          # attributes, so a zero-match means the report format changed. Failing
          # the step loudly beats printing a confident 0.
          tests="$(extract_sum tests)"
          failures="$(extract_sum failures)"
          errors="$(extract_sum errors)"
          skipped="$(extract_sum skipped)"
          passed="$(( tests - failures - errors - skipped ))"
          {
            echo "## bats results (${LABEL})"
            echo ""
            echo "| files | total | passed | failed | errors | skipped |"
            echo "|------:|------:|-------:|-------:|-------:|--------:|"
            echo "| ${report_files} | ${tests} | ${passed} | ${failures} | ${errors} | ${skipped} |"
            if [[ "${skipped}" -gt 0 ]]; then
              echo ""
              echo "> ⚠️ ${skipped} in-job test(s) SKIPPED — see the annotated run for the per-test skip reason. On hooks/test the usual cause is the six DB-dualwrite suites finding no initdb/pg_ctl/createdb/psql/python3 on the runner (they self-skip rather than fail); elsewhere it is typically the metered \`claude\` CLI path."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # AutoAgent self-improvement loop: Python stdlib `unittest` suites. No DB, no
  # third-party deps, no `claude` CLI — pure-stdlib by design, so the 3.11/3.12
  # matrix carries no dependency-install risk. fail-fast:false so one version's
  # failure does not cancel the other.
  # ---------------------------------------------------------------------------
  test-python:
    name: "test: autoagent unittest"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [gate-lint, gate-typecheck, gate-doctor, detect-changes]
    if: needs.detect-changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # unittest prints its "Ran N tests ... OK/FAILED (...)" trailer to STDERR.
      # We tee that stream to a file, then emit a GITHUB_STEP_SUMMARY aggregate
      # line — WITHOUT swallowing the exit code. `set -o pipefail` makes each
      # discover pipeline exit non-zero on failure; the rc latch (`|| rc=1`, NOT
      # `|| true`) carries that failure across BOTH roots so a regression in
      # either suite still reddens the job + the ci-pass gate. Two roots because
      # `unittest discover` takes a single -s: autoagent/test AND hooks/test (the
      # home-anchored ga_paths seam suite lives under hooks/test). The summary
      # step below (if:always()) reads the one combined log.
      - name: Run autoagent + hooks unittest suites
        id: unittest
        run: |
          set -o pipefail
          log="unittest-${{ matrix.python-version }}.log"
          : >"${log}"
          rc=0
          for root in autoagent/test hooks/test; do
            python3 -m unittest discover -s "${root}" -p 'test_*.py' -v \
              2>&1 | tee -a "${log}" || rc=1
          done
          exit "${rc}"

      - name: Summarize autoagent unittest results
        if: always()
        run: |
          log="unittest-${{ matrix.python-version }}.log"
          {
            echo "## autoagent unittest (Python ${{ matrix.python-version }})"
            echo ""
            if [[ ! -f "${log}" ]]; then
              echo "> no unittest output captured (suite did not run)"
              exit 0
            fi
            # "Ran N tests in Xs" + the trailing OK / FAILED(...) verdict line.
            ran="$(grep -E '^Ran [0-9]+ test' "${log}" | tail -n1)"
            verdict="$(grep -E '^(OK|FAILED)' "${log}" | tail -n1)"
            echo "- ${ran:-Ran ? tests}"
            echo "- result: ${verdict:-unknown}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # scripts/test Python suites: a SIBLING job rather than a step inside
  # test-python, because that job is declared pure-stdlib by design and this one
  # installs pytest. pytest natively collects the unittest-style files too, so a
  # single invocation covers every scripts/test/test_*.py — none of which any CI
  # job read before. Dependencies come from requirements-dev.txt (CI-only) so the
  # end-user bootstrap manifest requirements.txt never ships a test package.
  # scripts/ is put on sys.path by scripts/test/conftest.py, so the invocation
  # needs no cwd/PYTHONPATH contortion.
  # ---------------------------------------------------------------------------
  test-python-pytest:
    name: "test: scripts pytest"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [gate-lint, gate-typecheck, gate-doctor, detect-changes]
    if: needs.detect-changes.outputs.python == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install CI-only test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      # Collection guard: pytest exits 5 on zero collected, but a SUBSET
      # collapse (one file silently dropped by an import error the run masks)
      # would still look green, so assert per-FILE presence instead of a total
      # count — a count literal drifts on the next added suite.
      - name: Assert every scripts/test suite is collected
        run: |
          set -o pipefail
          python3 -m pytest scripts/test/ --collect-only -q --color=no >collected.txt
          rc=0
          for f in scripts/test/test_*.py; do
            if ! grep -qF "${f}::" collected.txt; then
              echo "FATAL: pytest collected no tests from ${f}" >&2
              rc=1
            fi
          done
          lifecycle="$(grep -cF 'scripts/test/test_agent_lifecycle_overhaul.py::' collected.txt || true)"
          if [[ -z "${lifecycle}" ]]; then lifecycle=0; fi
          if ((lifecycle < 9)); then
            echo "FATAL: expected >=9 collected tests in test_agent_lifecycle_overhaul.py, got ${lifecycle}" >&2
            rc=1
          fi
          exit "${rc}"

      - name: Run scripts/test pytest suites
        id: pytest
        run: |
          set -o pipefail
          # --color=no: pytest emits ANSI even into a pipe, which would break the
          # summary step's plain-text verdict grep below.
          python3 -m pytest scripts/test/ -v --color=no 2>&1 | tee pytest.log

      - name: Summarize scripts pytest results
        if: always()
        run: |
          {
            echo "## scripts/test pytest (Python 3.12)"
            echo ""
            if [[ ! -f pytest.log ]]; then
              echo "> no pytest output captured (suite did not run)"
              exit 0
            fi
            verdict="$(grep -E '^=+ .*(passed|failed|error).* =+$' pytest.log | tail -n1)"
            echo "- result: ${verdict:-unknown}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # Monitor: typecheck + node:test. Both need a LIVE peer-auth Postgres on the
  # /tmp socket (Prisma $queryRaw oracles) AND real chromium (browser-pool /
  # html/pdf export tests use Playwright with no mock — see browser-pool.ts).
  # This is the ONLY stage-2 job that provisions Postgres + chromium.
  # oss-db-setup.sh runs `npm ci` + renders .env + createdb (main + shadow) +
  # `prisma generate` + `prisma migrate deploy`, so the full DB path lives here
  # (the fast-gate typecheck job runs only the offline generate).
  # ---------------------------------------------------------------------------
  test-monitor:
    name: "test: monitor typecheck + tests (live DB)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    needs: [gate-lint, gate-typecheck, gate-doctor, detect-changes]
    if: needs.detect-changes.outputs.monitor == 'true'
    steps:
      # STAGED egress hardening. AUDIT mode only — it INSTRUMENTS (never blocks)
      # outbound network so a first real CI run produces a StepSecurity egress
      # baseline. MUST be the literal FIRST step (before checkout + the
      # setup-monitor-node / setup-postgres-peer-auth composites) so the apt /
      # npm-ci / playwright-download egress is captured. Promote audit -> block
      # only AFTER reviewing that baseline and pinning the derived allowlist;
      # the allowlist cannot be derived offline, so block is deferred by design.
      - name: Harden runner (egress audit — STAGED, not blocking)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node toolchain (monitor/.nvmrc) + npm cache + Playwright browser cache.
      - name: Set up monitor Node
        uses: ./.github/actions/setup-monitor-node

      # Native peer-auth Postgres on the /tmp socket (host=/tmp contract baked
      # into .env.example + oss-db-setup.sh, PG_SOCKET=/tmp). The composite also
      # replaces the old single-shot psql probe with a pg_isready retry loop.
      - name: Set up peer-auth Postgres on /tmp socket
        uses: ./.github/actions/setup-postgres-peer-auth

      # oss-db-setup.sh runs `npm ci` + renders monitor/.env + createdb (main +
      # shadow) + `prisma generate` + `prisma migrate deploy`. Idempotent.
      - name: Bootstrap monitor DB (renders .env, migrates schema)
        working-directory: monitor
        run: bash scripts/oss-db-setup.sh

      # Real chromium for the browser-pool / export test boundary (no mock).
      # postinstall already ran `playwright install chromium` during npm ci, but
      # --with-deps pulls the shared libs a hosted runner lacks.
      - name: Install Playwright chromium with system deps
        working-directory: monitor
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        working-directory: monitor
        run: npm run typecheck

      - name: Test (node:test via tsx, live DB + chromium)
        working-directory: monitor
        run: npm test

  # ---------------------------------------------------------------------------
  # macOS install path. install.sh is macOS-ONLY by hard gate (preflight kills a
  # non-Darwin `uname -s` with EXIT_NOT_MACOS), so every ubuntu job above is
  # structurally blind to it: this is the only place the installer is exercised
  # at all. It builds the release bundle FROM THE PR TREE, installs through the
  # documented local seam (GA_INSTALL_SRC_BUNDLE + GA_INSTALL_SRC_MANIFEST —
  # both set skips the network entirely) into a runner-temp sandbox, and asserts
  # preflight + the S2 staging SHA-256 verification actually ran.
  #
  # NO path filter and NO `if:` — deliberate. Two reasons: (a) it shares zero
  # edit surface with the `detect-changes` filters block, so it cannot be
  # weakened by an unrelated edit there; (b) most manifest members are markdown
  # (rules/, agents/, scoped/), so a docs-only PR still changes the installed
  # surface. Public-repo macOS minutes are unbilled, so always-run is cheap.
  #
  # MANIFEST-FRESHNESS COUPLING (a deliberate policy choice, not a side effect):
  # `publish-release.sh build` runs verify_manifest (generate-manifest.sh
  # --check, a whole-set file/hash/mode comparison), and no other CI check
  # catches a stale manifest today. Under always-run this job therefore becomes
  # the FIRST enforcement point for manifest freshness — any PR touching a
  # manifest-scope path stays red until manifest.json is regenerated. The
  # rejected alternative was regenerating the manifest inside the job, which
  # would have kept the install proof but dropped the freshness gate.
  #
  # NOT a launchd/TCC test and NOT a live-harness test: GA_NO_RUN keeps the
  # launcher unstarted, and "hook placement" here means landing under GA_DIR —
  # never binding into a real ~/.claude (asserted below as live non-contact).
  # ---------------------------------------------------------------------------
  test-install-macos:
    name: "test: macOS install path (local bundle seam)"
    runs-on: macos-latest
    # 20, not 10: the 700+-entry manifest --check plus the same-sized staging
    # verification are thousands of shasum forks, and macOS shasum is perl-based.
    # A cold runner has thin margin at 10; a flaky-timeout hunt costs more.
    timeout-minutes: 20
    permissions:
      contents: read
    needs: [gate-lint, gate-typecheck, gate-doctor]
    steps:
      # Default git checkout is REQUIRED (not just convenient): the manifest
      # freshness check shells out to git and exits 3 outside a work tree, so a
      # tarball / no-git checkout would break the build step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Loud-fail on runner-image drift instead of dying deep inside the builder.
      # brew is the sanctioned fallback for jq ONLY — the rest ship with macOS,
      # so an absent one means a broken image, not a gap this job should paper over.
      - name: Assert runner tool prerequisites
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq absent from the runner image — installing via brew" >&2
            brew install jq
          fi
          missing=""
          for tool in jq tar curl shasum git; do
            if ! command -v "${tool}" >/dev/null 2>&1; then
              missing="${missing} ${tool}"
            fi
          done
          if [[ -n "${missing}" ]]; then
            echo "FATAL: required tool(s) absent on the runner:${missing}" >&2
            exit 1
          fi

      # Positive log evidence that the stock-bash-3.2 contract was really
      # exercised. The contract surface is the explicit `/bin/bash install.sh`
      # call below — publish-release.sh / generate-manifest.sh run under `env
      # bash` from PATH by their shebang, which is fine and is NOT that surface.
      - name: Show /bin/bash version (bash 3.2 contract evidence)
        run: /bin/bash --version

      # Single source of truth for every sandbox path. `runner.temp` is an
      # Actions EXPRESSION, so it is bound to an env var and dereferenced as a
      # plain shell var — never spliced into the run: text (the repo-wide
      # injection-avoidance shape). A job-level `env:` cannot carry it (the
      # runner context is step-scoped) and `env:` does not expand shell vars, so
      # the values are exported through $GITHUB_ENV for the later steps.
      - name: Resolve sandbox paths and record the live-tree baseline
        env:
          RUNNER_TMP: ${{ runner.temp }}
        run: |
          {
            echo "GA_RELEASE_OUT=${RUNNER_TMP}/release"
            echo "GA_DIR=${RUNNER_TMP}/ga"
            echo "INSTALL_LOG=${RUNNER_TMP}/install.log"
          } >> "${GITHUB_ENV}"
          # Live non-contact oracle: whatever this is now, it must be identical
          # after the install (the installer creates no facade without consent).
          if [[ -e "${HOME}/.claude" ]]; then
            echo "LIVE_CLAUDE_BEFORE=present" >> "${GITHUB_ENV}"
          else
            echo "LIVE_CLAUDE_BEFORE=absent" >> "${GITHUB_ENV}"
          fi

      # The real bundle+manifest builder. NOT the repo-root build-glass-atrium.sh
      # (a one-shot ~/.claude → ~/.glass-atrium migration copier that requires an
      # existing $HOME/.claude and produces neither tar nor manifest — it FATALs
      # on a runner). `build` needs no network and no gh; gh is publish-only.
      - name: Build the release bundle from the PR tree
        run: bash scripts/publish-release.sh build --out "${GA_RELEASE_OUT}"

      # Assert the asset exists BEFORE installing, at the name the builder
      # composes from manifest .version — so a builder rename surfaces here as a
      # named failure instead of a confusing extraction error two steps later.
      - name: Assert the built bundle exists before installing
        run: |
          version="$(jq -r '.version' "${GA_RELEASE_OUT}/manifest.json")"
          if [[ -z "${version}" || "${version}" == "null" ]]; then
            echo "FATAL: the staged manifest carries no .version" >&2
            exit 1
          fi
          bundle="${GA_RELEASE_OUT}/glass-atrium-bundle-${version}.tar.gz"
          if [[ ! -f "${bundle}" ]]; then
            echo "FATAL: expected bundle absent: ${bundle}" >&2
            ls -la "${GA_RELEASE_OUT}" >&2
            exit 1
          fi
          echo "BUNDLE_PATH=${bundle}" >> "${GITHUB_ENV}"

      # `/bin/bash install.sh`, NOT `./install.sh`: the shebang routes through
      # `env bash`, i.e. whichever bash PATH happens to resolve to on the
      # runner, so it would not pin the 3.2 contract. The explicit interpreter
      # does, and the version step above is its evidence. The log is REDIRECTED,
      # never piped through tee — a pipe would hide install.sh's exit code
      # behind the pipeline status.
      - name: Install into the sandbox via the local bundle seam
        env:
          # Both seam vars are required: install.sh skips the network only when
          # BOTH are set. GA_DIR / INSTALL_LOG come from the resolve step above.
          # The launcher-only launchd-skip override is deliberately NOT set:
          # install.sh never reads it, so setting it would be cargo cult.
          GA_INSTALL_SRC_BUNDLE: ${{ env.BUNDLE_PATH }}
          GA_INSTALL_SRC_MANIFEST: ${{ env.GA_RELEASE_OUT }}/manifest.json
          GA_NO_RUN: "1"
        run: |
          rc=0
          /bin/bash install.sh > "${INSTALL_LOG}" 2>&1 || rc=$?
          if [[ "${rc}" -ne 0 ]]; then
            echo "FATAL: install.sh exited ${rc} — full log follows" >&2
            cat "${INSTALL_LOG}" >&2
            exit "${rc}"
          fi
          cat "${INSTALL_LOG}"

      # Every assertion is hard-fail; they are collected so one run names ALL
      # the broken invariants instead of only the first.
      - name: Assert install outcome
        run: |
          rc=0
          fail() {
            echo "FATAL: $*" >&2
            rc=1
          }

          # S2 staging verification actually ran (the per-file SHA-256 gate).
          if ! grep -qF 'Verifying per-file SHA-256' "${INSTALL_LOG}"; then
            fail "install log carries no 'Verifying per-file SHA-256' anchor — S2 staging verification did not run"
          fi
          # The GA_NO_RUN branch was taken (launcher not started, exit 0).
          if ! grep -qF 'Install complete (GA_NO_RUN set)' "${INSTALL_LOG}"; then
            fail "install log carries no 'Install complete (GA_NO_RUN set)' anchor"
          fi

          # Placement completeness: every manifest member landed under GA_DIR.
          missing=0
          while IFS= read -r rel; do
            if [[ ! -e "${GA_DIR}/${rel}" ]]; then
              missing=$((missing + 1))
              if [[ "${missing}" -le 10 ]]; then
                echo "  missing manifest member: ${rel}" >&2
              fi
            fi
          done < <(jq -r '.files[]' "${GA_RELEASE_OUT}/manifest.json")
          if [[ "${missing}" -ne 0 ]]; then
            fail "${missing} manifest member(s) absent under GA_DIR (first 10 listed above)"
          fi

          # Hook placement = landing under GA_DIR, NOT binding into a live ~/.claude.
          if [[ ! -d "${GA_DIR}/hooks" ]]; then
            fail "${GA_DIR}/hooks does not exist"
          else
            hook_files="$(find "${GA_DIR}/hooks" -type f | wc -l | tr -d ' ')"
            if [[ "${hook_files}" -eq 0 ]]; then
              fail "${GA_DIR}/hooks is empty"
            fi
          fi

          # Mode enforcement evidence. install.sh's handoff already asserts this
          # before the GA_NO_RUN branch, so it is redundant — kept as explicit
          # evidence in the log, and it is not load-bearing.
          if [[ ! -x "${GA_DIR}/glass-atrium" ]]; then
            fail "${GA_DIR}/glass-atrium is not executable (manifest.modes enforcement)"
          fi

          # Live non-contact: the sandbox install must create nothing at ~/.claude.
          if [[ -e "${HOME}/.claude" ]]; then
            live_after=present
          else
            live_after=absent
          fi
          if [[ "${live_after}" != "${LIVE_CLAUDE_BEFORE}" ]]; then
            fail "live ~/.claude changed state: ${LIVE_CLAUDE_BEFORE} -> ${live_after}"
          fi
          # Supporting (non-gating) evidence for the consent gate staying shut.
          if grep -qF 'No consented deployment' "${INSTALL_LOG}"; then
            echo "note: mirror farm skipped — 'No consented deployment' anchor present"
          fi

          exit "${rc}"

  # ===========================================================================
  # STAGE 3 — E2E. Advisory / PR-optional: job-level continue-on-error so a slow
  # e2e flake surfaces as its own non-blocking check and NEVER gates ci-pass
  # (it is deliberately excluded from ci-pass's `needs`).
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Full sandboxed E2E bootstrap proof: clones the repo into a fake HOME, runs
  # the FULL install path (config + plist render + symlink farm + wire_hooks +
  # DB bootstrap) against a THROWAWAY db, starts the monitor directly (no
  # launchd), smoke-checks /api/health, asserts uninstall parity, and tears
  # down. launchd is STATIC-verified only (the script never calls launchctl).
  # Needs the same peer-auth /tmp Postgres as test-monitor, plus jq (script
  # preflight demands it) and `npm ci` (the fake-HOME clone has no node_modules
  # until installed) + playwright chromium.
  # ---------------------------------------------------------------------------
  test-e2e:
    name: "test: sandboxed E2E bootstrap (advisory)"
    runs-on: ubuntu-latest
    # detect-changes is listed alongside test-monitor because this job's `if:`
    # reads needs.detect-changes.outputs.monitor — a job can only read outputs of
    # jobs in its own needs list, even though test-monitor already transitively
    # needs it.
    needs: [detect-changes, test-monitor]
    if: needs.detect-changes.outputs.monitor == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    # Advisory / PR-optional: shows as its own non-blocking check and is
    # excluded from ci-pass's failure gate.
    continue-on-error: true
    steps:
      # STAGED egress hardening. AUDIT mode only — instruments (never blocks)
      # outbound network to produce a first-run StepSecurity egress baseline.
      # MUST be the literal FIRST step (before checkout + composites) so the
      # apt / npm-ci / playwright-download egress is captured. Promote audit ->
      # block only AFTER reviewing that baseline; the allowlist cannot be derived
      # offline, so block is deferred by design.
      - name: Harden runner (egress audit — STAGED, not blocking)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node toolchain (monitor/.nvmrc) + npm cache + Playwright browser cache.
      - name: Set up monitor Node
        uses: ./.github/actions/setup-monitor-node

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Native peer-auth Postgres on the /tmp socket — same contract as
      # test-monitor; the composite replaces the single-shot psql probe with a
      # pg_isready retry loop.
      - name: Set up peer-auth Postgres on /tmp socket
        uses: ./.github/actions/setup-postgres-peer-auth

      # The script clones THIS repo, so the live `glass_atrium` DB it diffs
      # against in parity checks does not exist on the runner — provide an empty
      # one so the before/after migration-count oracles have a stable baseline.
      - name: Create baseline glass_atrium DB (E2E parity oracle)
        run: createdb -h /tmp glass_atrium

      # npm ci is required: the fake-HOME clone has no node_modules, and the
      # script's preflight + playwright cache reuse depend on the installed deps.
      - name: Install Playwright chromium with system deps
        working-directory: monitor
        timeout-minutes: 12
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run sandboxed E2E bootstrap
        run: bash test/oss-e2e-bootstrap.sh

      # Preserve E2E diagnostics on failure for post-mortem.
      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-bootstrap-logs
          path: |
            /tmp/glass-atrium-e2e-*.log
          if-no-files-found: ignore

  # ===========================================================================
  # STAGE 4 — ci-pass: the SINGLE required status check. Runs with always() so
  # it observes every upstream result, then asserts the gate in a bash STEP
  # (not a job-level if:), so a real upstream failure yields a non-zero job exit
  # the branch protection observes. test-e2e is deliberately NOT in `needs`
  # (it is advisory/continue-on-error). A SKIPPED upstream (path-filter miss)
  # counts as OK; only 'failure' or 'cancelled' fails the gate.
  # ===========================================================================
  ci-pass:
    name: ci-pass (required)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # ci-pass runs no checkout and never uses the token — it only reads upstream
    # job results via the `needs` context (an expression, not a token call). The
    # deny-all workflow default already covers it; contents: read is stated for
    # per-job uniformity with the other gate jobs and grants nothing extra.
    permissions:
      contents: read
    if: always()
    needs:
      - gate-lint
      - gate-typecheck
      - gate-doctor
      - test-bash
      - test-python
      - test-python-pytest
      - test-monitor
      - test-install-macos
    steps:
      # SECURITY (audited-safe — expression-injection avoidance): the `${{ }}`
      # results are bound to ENV VARS (HAS_FAILURE / HAS_CANCELLED) and the run:
      # body dereferences only the shell vars "${HAS_FAILURE}" — the GitHub
      # expression is NEVER interpolated directly into the script text. This is
      # the same env-var INDIRECTION pattern the composites use for their
      # `${{ inputs.* }}` values (setup-postgres-peer-auth SOCKET_DIR/PG_DATABASE)
      # and the test-python / summarize steps use for `${{ matrix.* }}`: binding
      # an expression to an env var and quoting the shell var closes the classic
      # `run:`-block expression-injection hole (a crafted context value being
      # spliced into the executed command). Here the values are booleans/results
      # (not attacker-controllable), but the indirection is applied uniformly so
      # the pattern is never the weak link. actionlint enforces this shape.
      - name: Assert no upstream failure or cancellation
        env:
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') }}
          HAS_CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "${HAS_FAILURE}" == "true" || "${HAS_CANCELLED}" == "true" ]]; then
            echo "FATAL: a required upstream job failed or was cancelled" >&2
            echo "  failure present:   ${HAS_FAILURE}" >&2
            echo "  cancelled present: ${HAS_CANCELLED}" >&2
            exit 1
          fi
          echo "ci-pass: all required upstream jobs succeeded or were skipped"
